<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="btnO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6821F"/>
      <stop offset="1" stop-color="#e06a00"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 浏览器外框 -->
  <rect width="1200" height="630" rx="10" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="42" rx="10" fill="url(#topbar)"/>
  <rect x="0" y="32" width="1200" height="10" fill="url(#topbar)"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#22c55e"/>
  <rect x="200" y="10" width="800" height="24" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="600" y="27" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#64748b">https://one.dash.cloudflare.com/ > Networks > Tunnels</text>

  <!-- 左侧导航栏 -->
  <rect x="0" y="42" width="200" height="588" fill="#111827"/>
  <rect x="0" y="42" width="200" height="48" fill="#1a2540"/>
  <circle cx="28" cy="66" r="12" fill="#F6821F"/>
  <text x="50" y="71" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Zero Trust</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">
    <rect x="12" y="108" width="176" height="34" rx="6" fill="#1e293b"/>
    <text x="30" y="130">📊 Dashboard</text>
    <text x="30" y="168">👥 My Team</text>
    <text x="30" y="206">⚙️ Settings</text>
    <text x="30" y="244" fill="#fdba74" font-weight="bold">🌐 Networks</text>
    <rect x="12" y="232" width="4" height="22" rx="2" fill="#F6821F"/>
    <text x="48" y="278" fill="#fdba74">Tunnels</text>
    <text x="48" y="310">Virtual Networks</text>
    <text x="48" y="342">Routes</text>
    <text x="30" y="380">🔐 Access</text>
    <text x="30" y="418">🛡️ Gateway</text>
  </g>

  <!-- 主内容区 -->
  <rect x="200" y="42" width="1000" height="588" fill="#f8fafc"/>
  <text x="232" y="86" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Tunnels</text>
  <rect x="1010" y="64" width="150" height="34" rx="6" fill="url(#btnO)"/>
  <text x="1085" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Create a tunnel</text>

  <!-- 表格头 -->
  <rect x="232" y="110" width="928" height="36" rx="6" fill="#e2e8f0"/>
  <text x="252" y="133" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Name</text>
  <text x="470" y="133" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Status</text>
  <text x="640" y="133" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Connections</text>
  <text x="860" y="133" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Created</text>

  <!-- 行1: home-lab -->
  <rect x="232" y="150" width="928" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="266" cy="178" r="8" fill="#22c55e"/>
  <text x="286" y="183" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0f172a">home-lab</text>
  <rect x="470" y="164" width="72" height="26" rx="13" fill="#dcfce7"/>
  <text x="506" y="182" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#15803d">HEALTHY</text>
  <text x="640" y="183" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">4 connections · 2 locations</text>
  <text x="860" y="183" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">2026-11-07</text>

  <!-- 行2: dev-env -->
  <rect x="232" y="212" width="928" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="266" cy="240" r="8" fill="#22c55e"/>
  <text x="286" y="245" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0f172a">dev-env</text>
  <rect x="470" y="226" width="72" height="26" rx="13" fill="#dcfce7"/>
  <text x="506" y="244" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#15803d">HEALTHY</text>
  <text x="640" y="245" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">4 connections · 1 location</text>
  <text x="860" y="245" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">2026-11-05</text>

  <!-- 行3: nas-tunnel (down) -->
  <rect x="232" y="274" width="928" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="266" cy="302" r="8" fill="#ef4444"/>
  <text x="286" y="307" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0f172a">nas-tunnel</text>
  <rect x="470" y="288" width="72" height="26" rx="13" fill="#fee2e2"/>
  <text x="506" y="306" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">DOWN</text>
  <text x="640" y="307" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">0 connections</text>
  <text x="860" y="307" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">2026-10-28</text>

  <!-- 分隔线 + 配置面板标题 -->
  <rect x="232" y="352" width="928" height="2" fill="#e2e8f0"/>
  <text x="232" y="392" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">home-lab · Public Hostnames</text>

  <!-- 路由表头 -->
  <rect x="232" y="408" width="928" height="34" rx="6" fill="#e2e8f0"/>
  <text x="252" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Subdomain</text>
  <text x="460" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Domain</text>
  <text x="640" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Service</text>
  <text x="900" y="430" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#475569">Type</text>

  <!-- 路由行 -->
  <rect x="232" y="446" width="928" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="252" y="472" font-family="Consolas, monospace" font-size="13" fill="#0f172a">nas</text>
  <text x="460" y="472" font-family="Consolas, monospace" font-size="13" fill="#0f172a">ldwl.dpdns.org</text>
  <text x="640" y="472" font-family="Consolas, monospace" font-size="13" fill="#0f172a">http://localhost:5000</text>
  <text x="900" y="472" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">HTTP</text>

  <rect x="232" y="492" width="928" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="252" y="518" font-family="Consolas, monospace" font-size="13" fill="#0f172a">ssh</text>
  <text x="460" y="518" font-family="Consolas, monospace" font-size="13" fill="#0f172a">ldwl.dpdns.org</text>
  <text x="640" y="518" font-family="Consolas, monospace" font-size="13" fill="#0f172a">ssh://localhost:22</text>
  <text x="900" y="518" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">SSH</text>

  <rect x="232" y="538" width="928" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="252" y="564" font-family="Consolas, monospace" font-size="13" fill="#0f172a">rdp</text>
  <text x="460" y="564" font-family="Consolas, monospace" font-size="13" fill="#0f172a">ldwl.dpdns.org</text>
  <text x="640" y="564" font-family="Consolas, monospace" font-size="13" fill="#0f172a">rdp://localhost:3389</text>
  <text x="900" y="564" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">RDP</text>

  <!-- 底部提示 -->
  <rect x="232" y="592" width="928" height="28" rx="6" fill="#fff7ed"/>
  <text x="252" y="611" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9a3412">💡 一个隧道可以挂多条 Public Hostname 路由，分别转发到内网不同端口的服务</text>
</svg>