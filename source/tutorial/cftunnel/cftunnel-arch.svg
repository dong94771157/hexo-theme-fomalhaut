<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6821F"/>
      <stop offset="1" stop-color="#e06a00"/>
    </linearGradient>
    <linearGradient id="user" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="svc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F6821F"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="bold" fill="#f1f5f9">Cloudflare Tunnel · 内网穿透架构</text>
  <text x="600" y="96" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#94a3b8">无需公网 IP、无需开放端口：cloudflared 主动外连，把内网服务安全暴露到互联网</text>

  <!-- 外网用户 -->
  <g filter="url(#sh)">
    <circle cx="130" cy="290" r="52" fill="url(#user)"/>
    <circle cx="130" cy="272" r="17" fill="#dbeafe"/>
    <path d="M103 320 C103 297, 157 297, 157 320 Z" fill="#dbeafe"/>
  </g>
  <text x="130" y="378" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#e2e8f0">外网用户</text>
  <text x="130" y="402" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">浏览器 / SSH / RDP</text>

  <!-- 箭头1: 用户 -> CF Edge -->
  <line x1="188" y1="290" x2="318" y2="290" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="253" y="274" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#cbd5e1">HTTPS 请求</text>
  <text x="253" y="314" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">app.example.com</text>

  <!-- Cloudflare Edge 云 -->
  <g filter="url(#sh)">
    <circle cx="372" cy="268" r="34" fill="url(#cf)"/>
    <circle cx="416" cy="246" r="44" fill="url(#cf)"/>
    <circle cx="470" cy="258" r="38" fill="url(#cf)"/>
    <circle cx="506" cy="284" r="26" fill="url(#cf)"/>
    <rect x="356" y="268" width="168" height="44" rx="20" fill="url(#cf)"/>
  </g>
  <text x="442" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">CF Edge</text>
  <text x="442" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">全球 300+ 节点</text>
  <text x="442" y="360" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">TLS 终结 · WAF · 缓存</text>

  <!-- 安全特性胶囊 -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fdba74">
    <rect x="352" y="386" width="86" height="32" rx="16" fill="none" stroke="#F6821F" stroke-width="1.5"/>
    <text x="395" y="407" text-anchor="middle">免费 SSL</text>
    <rect x="448" y="386" width="86" height="32" rx="16" fill="none" stroke="#F6821F" stroke-width="1.5"/>
    <text x="491" y="407" text-anchor="middle">DDoS 防护</text>
  </g>

  <!-- 箭头2: CF Edge -> Tunnel (加密隧道, 双向) -->
  <line x1="540" y1="276" x2="672" y2="276" stroke="#F6821F" stroke-width="4" marker-end="url(#arrO)"/>
  <line x1="672" y1="306" x2="540" y2="306" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrG)"/>
  <text x="606" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#fdba74">加密隧道</text>
  <text x="606" y="332" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#86efac">cloudflared 主动外连 (出站)</text>

  <!-- 隧道标识 -->
  <g filter="url(#sh)">
    <rect x="676" y="236" width="130" height="110" rx="14" fill="#0b3b24" stroke="#22c55e" stroke-width="2"/>
    <rect x="692" y="252" width="98" height="22" rx="6" fill="#22c55e" opacity="0.25"/>
    <text x="741" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#86efac">cloudflared</text>
    <rect x="692" y="282" width="98" height="22" rx="6" fill="#16a34a" opacity="0.25"/>
    <text x="741" y="298" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#86efac">4 条连接</text>
    <rect x="692" y="312" width="98" height="22" rx="6" fill="#15803d" opacity="0.25"/>
    <text x="741" y="328" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#86efac">自动重连</text>
  </g>
  <text x="741" y="374" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">跑在内网机器上</text>

  <!-- 家庭/内网边界框 -->
  <rect x="838" y="150" width="310" height="400" rx="18" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="858" y="136" width="150" height="28" rx="14" fill="#15803d"/>
  <text x="933" y="155" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#dcfce7">家庭 / 公司内网</text>

  <!-- 箭头3: cloudflared -> 内网服务 -->
  <line x1="812" y1="290" x2="872" y2="290" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="842" y="276" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#cbd5e1">localhost</text>

  <!-- 内网服务1: Web -->
  <g filter="url(#sh)">
    <rect x="876" y="178" width="120" height="76" rx="12" fill="url(#svc)"/>
    <rect x="892" y="194" width="88" height="18" rx="5" fill="#f3e8ff"/>
    <text x="936" y="207" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7e22ce">NAS 管理面板</text>
    <text x="936" y="234" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e9d5ff">:5000</text>
  </g>

  <!-- 内网服务2: SSH -->
  <g filter="url(#sh)">
    <rect x="876" y="270" width="120" height="76" rx="12" fill="url(#svc)"/>
    <rect x="892" y="286" width="88" height="18" rx="5" fill="#f3e8ff"/>
    <text x="936" y="299" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7e22ce">Linux SSH</text>
    <text x="936" y="326" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e9d5ff">:22</text>
  </g>

  <!-- 内网服务3: RDP -->
  <g filter="url(#sh)">
    <rect x="876" y="362" width="120" height="76" rx="12" fill="url(#svc)"/>
    <rect x="892" y="378" width="88" height="18" rx="5" fill="#f3e8ff"/>
    <text x="936" y="391" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7e22ce">Windows RDP</text>
    <text x="936" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e9d5ff">:3389</text>
  </g>

  <!-- 内网服务4: 发卡站 -->
  <g filter="url(#sh)">
    <rect x="876" y="454" width="120" height="76" rx="12" fill="url(#svc)"/>
    <rect x="892" y="470" width="88" height="18" rx="5" fill="#f3e8ff"/>
    <text x="936" y="483" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7e22ce">发卡站</text>
    <text x="936" y="510" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e9d5ff">:8080</text>
  </g>

  <!-- 底部标注 -->
  <rect x="180" y="560" width="840" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="590" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#94a3b8">关键点：所有连接由内网侧主动发起，路由器无需端口映射，真实 IP 永不暴露</text>
</svg>