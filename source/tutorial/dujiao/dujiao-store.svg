  <text x="120" y="226" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ddd6fe">支付成功秒级发货，卡密自动发送至订单页与邮箱</text>
  <rect x="940" y="184" width="150" height="36" rx="18" fill="#ffffff" opacity="0.95"/>
