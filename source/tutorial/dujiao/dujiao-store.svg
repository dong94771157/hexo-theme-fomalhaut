<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#e2e8f0"/>

  <!-- 浏览器窗口 -->
  <g filter="url(#sh)">
    <rect x="40" y="36" width="1120" height="560" rx="14" fill="#ffffff"/>
  </g>
  <!-- 浏览器顶栏 -->
  <rect x="40" y="36" width="1120" height="46" rx="14" fill="#f1f5f9"/>
  <rect x="40" y="68" width="1120" height="14" fill="#f1f5f9"/>
  <circle cx="70" cy="59" r="7" fill="#ef4444"/>
  <circle cx="94" cy="59" r="7" fill="#f59e0b"/>
  <circle cx="118" cy="59" r="7" fill="#22c55e"/>
  <rect x="300" y="47" width="600" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="316" cy="59" r="5" fill="#22c55e"/>
  <rect x="328" y="55" width="10" height="8" rx="2" fill="#94a3b8"/>
  <text x="350" y="63" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">https://shop.example.com/</text>

