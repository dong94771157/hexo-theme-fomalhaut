  <text x="459" y="532" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#16a34a">● 库存 56 件</text>

  <!-- 商品卡片 3 -->
  <g filter="url(#sh)">
    <rect x="798" y="318" width="330" height="230" rx="12" fill="#ffffff"/>
  </g>
  <rect x="798" y="318" width="330" height="96" rx="12" fill="#fee2e2"/>
  <rect x="798" y="398" width="330" height="16" fill="#fee2e2"/>
