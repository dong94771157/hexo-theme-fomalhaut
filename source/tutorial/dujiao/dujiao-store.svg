  <text x="822" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#dc2626">¥25.00</text>
  <rect x="1012" y="484" width="92" height="32" rx="8" fill="url(#btn)"/>
  <text x="1058" y="505" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">立即购买</text>
  <text x="822" y="532" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#16a34a">● 库存 302 件</text>

