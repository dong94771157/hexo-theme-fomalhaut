  <rect x="72" y="98" width="28" height="24" rx="6" fill="#8b5cf6"/>
  <text x="86" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">D</text>
  <text x="112" y="117" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">独角数卡 Next</text>
