  <rect x="40" y="566" width="1120" height="30" fill="#f8fafc"/>
  <text x="600" y="586" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">前台界面示意（Vue 3 + Tailwind CSS v4）：商品列表 · 分类筛选 · 订单查询 · 邮箱收卡</text>
