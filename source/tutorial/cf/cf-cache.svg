<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#e2e8f0"/>

  <g filter="url(#sh)">
    <rect x="40" y="30" width="1120" height="570" rx="12" fill="#ffffff"/>
  </g>

  <!-- 浏览器顶栏 -->
  <rect x="40" y="30" width="1120" height="52" rx="12" fill="#f1f5f9"/>
  <rect x="40" y="58" width="1120" height="24" fill="#f1f5f9"/>
  <circle cx="72" cy="56" r="7" fill="#ef4444"/>
  <circle cx="96" cy="56" r="7" fill="#eab308"/>
  <circle cx="120" cy="56" r="7" fill="#22c55e"/>
  <rect x="160" y="42" width="620" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="180" cy="56" r="5" fill="#22c55e"/>
  <text x="196" y="61" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">https://dash.cloudflare.com/ldwl.tech/caching/cache-rules</text>

  <!-- 左侧边栏 -->
  <rect x="40" y="82" width="230" height="518" fill="#1e293b"/>
  <g transform="translate(62,108)">
    <circle cx="12" cy="12" r="12" fill="#F6821F"/>
    <text x="34" y="17" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">Cloudflare</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">
    <text x="66" y="170">概述</text>
    <text x="66" y="206">DNS 记录</text>
    <text x="66" y="242">SSL/TLS</text>
    <rect x="48" y="258" width="214" height="38" rx="8" fill="#F6821F" opacity="0.18"/>
    <rect x="48" y="258" width="4" height="38" fill="#F6821F"/>
    <text x="66" y="282" fill="#F6821F" font-weight="bold">缓存规则</text>
    <text x="66" y="322">安全性</text>
    <text x="66" y="358">速度</text>
    <text x="66" y="394">规则</text>
    <text x="66" y="430">网络</text>
  </g>

  <!-- 内容区 -->
  <text x="310" y="130" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">缓存规则</text>
  <text x="310" y="158" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">自定义 Cloudflare 边缘缓存的匹配条件与过期时间</text>

  <!-- 创建规则按钮 -->
  <rect x="1020" y="108" width="100" height="38" rx="8" fill="#F6821F"/>
  <text x="1070" y="132" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">创建规则</text>

  <!-- 表头 -->
  <rect x="310" y="180" width="810" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#64748b">
    <text x="330" y="206">序号</text>
    <text x="385" y="206">规则名称</text>
    <text x="560" y="206">匹配条件</text>
    <text x="790" y="206">缓存 TTL</text>
    <text x="950" y="206">状态</text>
  </g>

  <!-- 规则1 -->
  <rect x="310" y="228" width="810" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="330" y="264" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">1</text>
  <text x="385" y="256" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">静态资源长缓存</text>
  <text x="385" y="278" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">边缘命中，0 回源</text>
  <rect x="560" y="244" width="200" height="28" rx="6" fill="#f1f5f9"/>
  <text x="572" y="263" font-family="Consolas, monospace" font-size="12" fill="#475569">*.css *.js *.png</text>
  <rect x="790" y="244" width="120" height="28" rx="6" fill="#ecfdf5"/>
  <text x="802" y="263" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#059669">1 年</text>
  <rect x="950" y="248" width="44" height="22" rx="11" fill="#22c55e"/>
  <circle cx="983" cy="259" r="9" fill="#ffffff"/>
  <text x="1010" y="264" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#16a34a">开</text>

  <!-- 规则2 -->
  <rect x="310" y="294" width="810" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="330" y="330" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">2</text>
  <text x="385" y="322" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">HTML 短缓存</text>
  <text x="385" y="344" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">兼顾更新时效</text>
  <rect x="560" y="310" width="200" height="28" rx="6" fill="#f1f5f9"/>
  <text x="572" y="329" font-family="Consolas, monospace" font-size="12" fill="#475569">/*.html</text>
  <rect x="790" y="310" width="120" height="28" rx="6" fill="#fff7ed"/>
  <text x="802" y="329" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">5 分钟</text>
  <rect x="950" y="314" width="44" height="22" rx="11" fill="#22c55e"/>
  <circle cx="983" cy="325" r="9" fill="#ffffff"/>
  <text x="1010" y="330" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#16a34a">开</text>

  <!-- 规则3 -->
  <rect x="310" y="360" width="810" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="330" y="396" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">3</text>
  <text x="385" y="388" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">后台与接口绕过</text>
  <text x="385" y="410" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">动态内容不缓存</text>
  <rect x="560" y="376" width="200" height="28" rx="6" fill="#f1f5f9"/>
  <text x="572" y="395" font-family="Consolas, monospace" font-size="12" fill="#475569">/admin/* /api/*</text>
  <rect x="790" y="376" width="120" height="28" rx="6" fill="#fef2f2"/>
  <text x="802" y="395" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">绕过缓存</text>
  <rect x="950" y="380" width="44" height="22" rx="11" fill="#22c55e"/>
  <circle cx="983" cy="391" r="9" fill="#ffffff"/>
  <text x="1010" y="396" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#16a34a">开</text>

  <!-- 缓存统计卡片 -->
  <rect x="310" y="440" width="255" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="330" y="470" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">缓存命中率</text>
  <text x="330" y="512" font-family="Arial" font-size="36" font-weight="bold" fill="#059669">96%</text>
  <rect x="330" y="528" width="215" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="330" y="528" width="206" height="10" rx="5" fill="#22c55e"/>

  <rect x="585" y="440" width="255" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="605" y="470" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">节省回源请求</text>
  <text x="605" y="512" font-family="Arial" font-size="36" font-weight="bold" fill="#F6821F">128 万</text>
  <text x="605" y="540" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">近 30 天累计</text>

  <rect x="860" y="440" width="255" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="880" y="470" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">平均边缘响应</text>
  <text x="880" y="512" font-family="Arial" font-size="36" font-weight="bold" fill="#2563eb">23 ms</text>
  <text x="880" y="540" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">TTFB 大幅下降</text>
</svg>