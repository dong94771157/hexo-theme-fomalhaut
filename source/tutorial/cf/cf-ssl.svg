<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 桌面背景 -->
  <rect width="1200" height="630" fill="#e2e8f0"/>

  <!-- 浏览器窗口 -->
  <g filter="url(#sh)">
    <rect x="40" y="30" width="1120" height="570" rx="12" fill="#ffffff"/>
  </g>

  <!-- 浏览器顶栏 -->
  <rect x="40" y="30" width="1120" height="52" rx="12" fill="#f1f5f9"/>
  <rect x="40" y="58" width="1120" height="24" fill="#f1f5f9"/>
  <circle cx="72" cy="56" r="7" fill="#ef4444"/>
  <circle cx="96" cy="56" r="7" fill="#eab308"/>
  <circle cx="120" cy="56" r="7" fill="#22c55e"/>
  <rect x="160" y="42" width="620" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="180" cy="56" r="5" fill="#22c55e"/>
  <text x="196" y="61" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">https://dash.cloudflare.com/ldwl.tech/ssl-tls</text>

  <!-- 左侧边栏 -->
  <rect x="40" y="82" width="230" height="518" fill="#1e293b"/>
  <g transform="translate(62,108)">
    <circle cx="12" cy="12" r="12" fill="#F6821F"/>
    <text x="34" y="17" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">Cloudflare</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">
    <text x="66" y="170">概述</text>
    <text x="66" y="206">DNS 记录</text>
    <rect x="48" y="222" width="214" height="38" rx="8" fill="#F6821F" opacity="0.18"/>
    <rect x="48" y="222" width="4" height="38" fill="#F6821F"/>
    <text x="66" y="246" fill="#F6821F" font-weight="bold">SSL/TLS</text>
    <text x="66" y="286">缓存规则</text>
    <text x="66" y="322">安全性</text>
    <text x="66" y="358">速度</text>
    <text x="66" y="394">规则</text>
    <text x="66" y="430">网络</text>
    <text x="66" y="466">Caching</text>
  </g>

  <!-- 内容区标题 -->
  <text x="310" y="130" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">SSL/TLS 加密模式</text>
  <text x="310" y="158" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">选择 Cloudflare 与源站之间流量的加密方式</text>

  <!-- 选项1: 关闭 -->
  <g>
    <rect x="310" y="180" width="810" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="345" cy="219" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="375" y="212" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#334155">关闭</text>
    <text x="375" y="238" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">不加密 — 仅适用于测试环境，访客与源站均明文传输</text>
  </g>

  <!-- 选项2: 灵活 -->
  <g>
    <rect x="310" y="270" width="810" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="345" cy="309" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="375" y="302" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#334155">灵活</text>
    <text x="375" y="328" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">浏览器到 Cloudflare 加密，CF 回源仍为 HTTP — 存在中间人风险，不推荐</text>
  </g>

  <!-- 选项3: 完全 -->
  <g>
    <rect x="310" y="360" width="810" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="345" cy="399" r="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="375" y="392" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#334155">完全</text>
    <text x="375" y="418" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">全链路加密，但接受源站自签名证书 — 无法完全防中间人</text>
  </g>

  <!-- 选项4: 完全(严格) - 选中 -->
  <g>
    <rect x="310" y="450" width="810" height="92" rx="10" fill="#fff7ed" stroke="#F6821F" stroke-width="2.5"/>
    <circle cx="345" cy="496" r="11" fill="#F6821F"/>
    <circle cx="345" cy="496" r="5" fill="#ffffff"/>
    <text x="375" y="482" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">完全（严格）</text>
    <text x="375" y="508" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9a3412">全链路加密，且源站必须持有受信任 CA 签发的有效证书 — 最安全，推荐</text>
    <rect x="1000" y="470" width="100" height="34" rx="17" fill="#F6821F"/>
    <text x="1050" y="492" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">已启用</text>
  </g>

  <!-- 底部提示条 -->
  <rect x="310" y="558" width="810" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="330" y="580" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#15803d">建议：源站安装 Let's Encrypt 免费证书后，选择「完全（严格）」实现端到端可信加密</text>
</svg>