<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="56" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#0f172a">传奇私服补丁分类总览</text>
  <text x="600" y="84" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">按作用范围分为客户端、登录器、服务端三大类，玩家日常接触最多的是客户端补丁</text>

  <!-- 中心节点 -->
  <g filter="url(#sh)">
    <rect x="470" y="120" width="260" height="64" rx="32" fill="#1e293b"/>
  </g>
  <text x="600" y="159" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">传奇私服补丁</text>

  <!-- 连接线 -->
  <line x1="600" y1="184" x2="600" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="220" x2="980" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="220" x2="220" y2="256" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="220" x2="600" y2="256" stroke="#94a3b8" stroke-width="2"/>
  <line x1="980" y1="220" x2="980" y2="256" stroke="#94a3b8" stroke-width="2"/>

  <!-- 一级分类: 客户端补丁 -->
  <g filter="url(#sh)">
    <rect x="80" y="256" width="280" height="58" rx="10" fill="#dc2626"/>
  </g>
  <text x="220" y="292" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">客户端补丁</text>

  <!-- 一级分类: 登录器补丁 -->
  <g filter="url(#sh)">
    <rect x="460" y="256" width="280" height="58" rx="10" fill="#d97706"/>
  </g>
  <text x="600" y="292" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">登录器补丁</text>

  <!-- 一级分类: 服务端补丁 -->
  <g filter="url(#sh)">
    <rect x="840" y="256" width="280" height="58" rx="10" fill="#0891b2"/>
  </g>
  <text x="980" y="292" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">服务端补丁</text>

  <!-- 二级子项: 客户端 -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="14">
    <line x1="220" y1="314" x2="220" y2="340" stroke="#fca5a5" stroke-width="2"/>
    <g filter="url(#sh)">
      <rect x="90" y="340" width="260" height="46" rx="8" fill="#ffffff" stroke="#fecaca"/>
    </g>
    <text x="220" y="368" text-anchor="middle" fill="#991b1b" font-weight="bold">装备外观补丁（.wil/.wis）</text>

    <g filter="url(#sh)">
      <rect x="90" y="396" width="260" height="46" rx="8" fill="#ffffff" stroke="#fecaca"/>
    </g>
    <text x="220" y="424" text-anchor="middle" fill="#991b1b" font-weight="bold">地图补丁（.map）</text>

    <g filter="url(#sh)">
      <rect x="90" y="452" width="260" height="46" rx="8" fill="#ffffff" stroke="#fecaca"/>
    </g>
    <text x="220" y="480" text-anchor="middle" fill="#991b1b" font-weight="bold">UI 界面补丁（界面/光标）</text>

    <g filter="url(#sh)">
      <rect x="90" y="508" width="260" height="46" rx="8" fill="#ffffff" stroke="#fecaca"/>
    </g>
    <text x="220" y="536" text-anchor="middle" fill="#991b1b" font-weight="bold">技能特效补丁（魔法效果）</text>
  </g>

  <!-- 二级子项: 登录器 -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="14">
    <line x1="600" y1="314" x2="600" y2="340" stroke="#fcd34d" stroke-width="2"/>
    <g filter="url(#sh)">
      <rect x="470" y="340" width="260" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    </g>
    <text x="600" y="368" text-anchor="middle" fill="#92400e" font-weight="bold">自动更新补丁列表</text>

    <g filter="url(#sh)">
      <rect x="470" y="396" width="260" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    </g>
    <text x="600" y="424" text-anchor="middle" fill="#92400e" font-weight="bold">反外挂/防挂模块</text>

    <g filter="url(#sh)">
      <rect x="470" y="452" width="260" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    </g>
    <text x="600" y="480" text-anchor="middle" fill="#92400e" font-weight="bold">服务器列表配置</text>

    <g filter="url(#sh)">
      <rect x="470" y="508" width="260" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    </g>
    <text x="600" y="536" text-anchor="middle" fill="#92400e" font-weight="bold">多开/防封组件</text>
  </g>

  <!-- 二级子项: 服务端 -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="14">
    <line x1="980" y1="314" x2="980" y2="340" stroke="#67e8f9" stroke-width="2"/>
    <g filter="url(#sh)">
      <rect x="850" y="340" width="260" height="46" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    </g>
    <text x="980" y="368" text-anchor="middle" fill="#155e75" font-weight="bold">脚本补丁（NPC/任务）</text>

    <g filter="url(#sh)">
      <rect x="850" y="396" width="260" height="46" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    </g>
    <text x="980" y="424" text-anchor="middle" fill="#155e75" font-weight="bold">数据库补丁（物品/怪物）</text>

    <g filter="url(#sh)">
      <rect x="850" y="452" width="260" height="46" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    </g>
    <text x="980" y="480" text-anchor="middle" fill="#155e75" font-weight="bold">引擎核心补丁（M2/GOM）</text>

    <g filter="url(#sh)">
      <rect x="850" y="508" width="260" height="46" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    </g>
    <text x="980" y="536" text-anchor="middle" fill="#155e75" font-weight="bold">网关补丁（RunGate/LoginGate）</text>
  </g>

  <!-- 底部说明 -->
  <rect x="80" y="572" width="1040" height="38" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="600" y="596" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#b91c1c">提示：玩家只需安装客户端补丁与登录器；服务端补丁由服主在服务端环境部署，切勿放进客户端目录</text>
</svg>