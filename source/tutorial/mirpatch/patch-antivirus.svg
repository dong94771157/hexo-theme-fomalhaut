<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 桌面背景 -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Windows 安全中心窗口 -->
  <g filter="url(#sh)">
    <rect x="200" y="30" width="800" height="570" rx="10" fill="#ffffff"/>
  </g>

  <!-- 标题栏 -->
  <rect x="200" y="30" width="800" height="52" rx="10" fill="#f3f4f6"/>
  <rect x="200" y="58" width="800" height="24" fill="#f3f4f6"/>
  <text x="224" y="64" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Windows 安全中心</text>
  <circle cx="960" cy="56" r="7" fill="#ef4444"/>
  <circle cx="936" cy="56" r="7" fill="#eab308"/>
  <circle cx="912" cy="56" r="7" fill="#22c55e"/>

  <!-- 左侧导航 -->
  <rect x="200" y="82" width="220" height="518" fill="#f9fafb"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4b5563">
    <text x="224" y="120">主页</text>
    <rect x="208" y="134" width="204" height="36" rx="8" fill="#fee2e2"/>
    <rect x="208" y="134" width="4" height="36" fill="#dc2626"/>
    <text x="224" y="158" fill="#b91c1c" font-weight="bold">病毒和威胁防护</text>
    <text x="224" y="200">帐户保护</text>
    <text x="224" y="236">防火墙和网络防护</text>
    <text x="224" y="272">应用和浏览器控制</text>
    <text x="224" y="308">设备安全性</text>
  </g>

  <!-- 内容区标题 -->
  <text x="460" y="128" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#111827">病毒和威胁防护</text>

  <!-- 红色警告横幅 -->
  <rect x="460" y="150" width="516" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="496" cy="186" r="18" fill="#dc2626"/>
  <text x="496" y="193" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#ffffff">!</text>
  <text x="528" y="180" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">发现受保护的文件夹中存在威胁</text>
  <text x="528" y="204" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#991b1b">已阻止 2 个威胁，需要你采取操作</text>

  <!-- 威胁条目 1 -->
  <rect x="460" y="244" width="516" height="96" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="460" y="244" width="6" height="96" rx="3" fill="#dc2626"/>
  <text x="486" y="272" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#111827">威胁：Trojan:Win32/Genric.MirPatch</text>
  <text x="486" y="296" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">文件：F:\MirClient\补丁包\登录器.exe</text>
  <text x="486" y="318" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">状态：已隔离 · 日期：2026/11/6 10:24</text>
  <rect x="860" y="266" width="96" height="32" rx="16" fill="#dc2626"/>
  <text x="908" y="287" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">查看详情</text>

  <!-- 威胁条目 2 -->
  <rect x="460" y="352" width="516" height="96" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="460" y="352" width="6" height="96" rx="3" fill="#dc2626"/>
  <text x="486" y="380" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#111827">威胁：PUA:Win32/Patcher.Bundle</text>
  <text x="486" y="404" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">文件：F:\MirClient\补丁包\WilRes\PrgUse.wil</text>
  <text x="486" y="426" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">状态：已隔离 · 日期：2026/11/6 10:24</text>
  <rect x="860" y="374" width="96" height="32" rx="16" fill="#dc2626"/>
  <text x="908" y="395" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">查看详情</text>

  <!-- 说明卡片 -->
  <rect x="460" y="466" width="516" height="108" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="486" y="494" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#92400e">为什么会被报毒？</text>
  <text x="486" y="518" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#a16207">传奇登录器与补丁常带加壳/内存加载特征，易被启发式引擎误判。</text>
  <text x="486" y="540" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#a16207">正确做法：先核实来源与 MD5，再添加排除项；切勿见报毒就盲目放行，</text>
  <text x="486" y="562" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#a16207">来路不明的补丁宁可不装。详见本文「注意事项」一节。</text>
</svg>